name: Build arm64-v8a APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed arm64-v8a APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/build_android.py --all-sources --abi arm64-v8a
      - name: Verify APK signature and ABI
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=$(find dist/android -maxdepth 1 -name '*arm64-v8a.apk' -print -quit)
          if [ -z "$apk" ]; then echo 'Missing arm64 APK' >&2; exit 1; fi
          expected=$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ -z "$expected" ]; then echo 'Missing certificate fingerprint' >&2; exit 1; fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          if [ -z "$apksigner" ]; then echo 'Missing apksigner' >&2; exit 1; fi
          output=$("$apksigner" verify --print-certs "$apk")
          printf '%s\n' "$output"
          actual=$(printf '%s\n' "$output" | awk '/(Signer #1 certificate SHA-256 digest:|certificate SHA-256 digest:)/ { print $NF }' | tail -n1 | tr '[:upper:]' '[:lower:]')
          if [ "$actual" != "$expected" ]; then
            echo "Certificate mismatch: expected $expected, got ${actual:-none}" >&2
            exit 1
          fi
          python - "$apk" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as apk:
              abis = {name.split('/')[1] for name in apk.namelist() if name.startswith('lib/') and name.count('/') >= 2}
          if abis != {'arm64-v8a'}:
              raise SystemExit(f'Unexpected APK ABIs: {sorted(abis)}')
          print('Verified arm64-v8a APK and release certificate')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-arm64-v8a
          path: dist/android/*arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish arm64-v8a release
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="arm64-v${version//+/-}"
          gh release create "$tag" dist/android/*arm64-v8a.apk \
            --target "$GITHUB_SHA" \
            --title "真果鉴 arm64-v8a $version" \
            --notes "全部站源，Android arm64-v8a。签名证书 SHA-256：${ANDROID_CERT_SHA256}"
